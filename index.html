<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Record Express — Colour scheme variants</title>
  <meta name="description" content="Preview index for the Record Express landing page colour-scheme variants." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff6eb;
      --ink: #122114;
      --muted: rgba(18, 33, 20, 0.65);
      --line: rgba(18, 33, 20, 0.2);
      --accent: #d55445;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Open Sans", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 640px; }
    .eyebrow {
      font-weight: 700; font-size: 12px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--accent); margin: 0 0 12px;
    }
    h1 {
      font-family: "Outfit", system-ui, sans-serif; font-weight: 800;
      font-size: clamp(30px, 5vw, 44px); line-height: 1.1; margin: 0;
      letter-spacing: -0.02em;
    }
    .lede { font-size: 16px; line-height: 26px; color: var(--muted); margin: 16px 0 40px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.variant {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 24px; border: 1px solid var(--line); border-radius: 16px;
      background: #fffdf9; color: inherit; text-decoration: none;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    a.variant:hover {
      transform: translateY(-2px); border-color: var(--accent);
      box-shadow: 0 12px 24px -12px rgba(18, 33, 20, 0.3);
    }
    .letter {
      font-family: "Outfit", system-ui, sans-serif; font-weight: 800;
      font-size: 20px; color: var(--accent); width: 24px; flex-shrink: 0;
    }
    .label { font-family: "Outfit", system-ui, sans-serif; font-weight: 700; font-size: 18px; flex: 1; }
    .go { color: var(--muted); font-size: 20px; line-height: 1; }
    footer { margin-top: 40px; font-size: 13px; line-height: 22px; color: var(--muted); }
    @media (prefers-reduced-motion: reduce) { a.variant { transition: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Record Express</p>
    <h1>Colour scheme variants</h1>
    <p class="lede">
      Four self-contained copies of the landing page. Each has its own stylesheet,
      so a change to one never affects the others.
    </p>
    <ul>
      <li>
        <a class="variant" href="variant-a/">
          <span class="letter">A</span>
          <span class="label">Variant A</span>
          <span class="go" aria-hidden="true">&#8594;</span>
        </a>
      </li>
      <li>
        <a class="variant" href="variant-b/">
          <span class="letter">B</span>
          <span class="label">Variant B</span>
          <span class="go" aria-hidden="true">&#8594;</span>
        </a>
      </li>
      <li>
        <a class="variant" href="variant-c/">
          <span class="letter">C</span>
          <span class="label">Variant C</span>
          <span class="go" aria-hidden="true">&#8594;</span>
        </a>
      </li>
      <li>
        <a class="variant" href="variant-d/">
          <span class="letter">D</span>
          <span class="label">Variant D</span>
          <span class="go" aria-hidden="true">&#8594;</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
